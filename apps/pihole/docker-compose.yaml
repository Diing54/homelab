services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: 'Africa/Nairobi'
      WEBPASSWORD: '${PIHOLE_WEBPASSWORD}'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp" 
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
