services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: 'Africa/Nairobi'
      WEBPASSWORD: '${PIHOLE_WEBPASSWORD}'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp" 
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
