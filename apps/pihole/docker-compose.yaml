services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: 'Africa/Nairobi'
      WEBPASSWORD: '${PIHOLE_WEBPASSWORD}'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp" 
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
