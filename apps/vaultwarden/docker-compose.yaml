services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Enables live-syncing across your devices
      - SIGNUPS_ALLOWED=false
      # DOMAIN is required for some features like U2F/WebAuthn
      - DOMAIN=https://vaultwarden.cloudiing.com
    volumes:
      - ./data:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
