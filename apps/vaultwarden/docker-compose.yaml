services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Enables live-syncing across your devices
      - SIGNUPS_ALLOWED=false
      # DOMAIN is required for some features like U2F/WebAuthn
      - DOMAIN=https://vaultwarden.cloudiing.com
    volumes:
      - ./data:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
