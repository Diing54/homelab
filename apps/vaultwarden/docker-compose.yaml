services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Enables live-syncing across your devices
      - SIGNUPS_ALLOWED=false
      # DOMAIN is required for some features like U2F/WebAuthn
      - DOMAIN=https://vaultwarden.cloudiing.com
    volumes:
      - ./data:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
