services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Enables live-syncing across your devices
      - SIGNUPS_ALLOWED=false
      # DOMAIN is required for some features like U2F/WebAuthn
      - DOMAIN=https://vaultwarden.cloudiing.com
    volumes:
      - ./data:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
