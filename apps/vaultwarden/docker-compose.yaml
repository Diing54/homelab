services:
  vaultwarden:
    image: vaultwarden/server:latest@sha256:d626d04934cd1192ad8ced1adb975099fca78cec33ab467d2d3c923cde7f3b0c
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Enables live-syncing across your devices
      - SIGNUPS_ALLOWED=false
      # DOMAIN is required for some features like U2F/WebAuthn
      - DOMAIN=https://vaultwarden.cloudiing.com
    volumes:
      - ./data:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
