services:
  # ── Nginx: public entry point ──────────────────────────────────
  devlog_nginx:
    image: nginx:1.30-alpine@sha256:0272e4604ed93c1792f03695a033a6e8546840f86e0de20a884bb17d2c924883
    container_name: devlog_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - homelab_net # Connects to Cloudflare Tunnel
      - devlog_internal   # Connects to backend/frontend

  # ── Frontend: React SPA served by nginx ────────────────────────
  frontend:
    image: ghcr.io/diing54/devlog/frontend:latest@sha256:c4faed92099992d6370154eca98723f8a5dc8d59ba65ffb472441d10f427e5e7
    container_name: devlog_frontend
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Backend: Node.js REST API ───────────────────────────────────
  backend:
    image: ghcr.io/diing54/devlog/backend:latest@sha256:f72dab7375f878c06820797499da24f658a046d5f3993299495bf5dc21430480
    container_name: devlog_backend
    env_file: .env
    environment:
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── PostgreSQL: persistent storage ─────────────────────────────
  postgres:
    image: postgres:18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    container_name: devlog_postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Redis: caching layer ────────────────────────────────────────
  redis:
    image: redis:8-alpine@sha256:b9646e7cdf8165d985b88bb3e61b3f2f7625db7f6c98af79def91997d04f26b9
    container_name: devlog_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devlog_internal

volumes:
  postgres_data:
  redis_data:

networks:
  homelab_net:
    external: true
  devlog_internal:
    driver: bridge
