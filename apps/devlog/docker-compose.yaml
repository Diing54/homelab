services:
  # ── Nginx: public entry point ──────────────────────────────────
  devlog_nginx:
    image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    container_name: devlog_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - homelab_net # Connects to Cloudflare Tunnel
      - devlog_internal   # Connects to backend/frontend

  # ── Frontend: React SPA served by nginx ────────────────────────
  frontend:
    image: ghcr.io/diing54/devlog/frontend:latest@sha256:fc1ea74cc2c4e476acd625c490461bb4df6aa7460221e88be0075974d547f493
    container_name: devlog_frontend
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Backend: Node.js REST API ───────────────────────────────────
  backend:
    image: ghcr.io/diing54/devlog/backend:latest@sha256:ccd495932bfc7846823ecad47a14356c0ebed93ea63a59c97c4dd4b3f30aef62
    container_name: devlog_backend
    env_file: .env
    environment:
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── PostgreSQL: persistent storage ─────────────────────────────
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: devlog_postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Redis: caching layer ────────────────────────────────────────
  redis:
    image: redis:8-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    container_name: devlog_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devlog_internal

volumes:
  postgres_data:
  redis_data:

networks:
  homelab_net:
    external: true
  devlog_internal:
    driver: bridge
