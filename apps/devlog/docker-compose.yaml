services:
  # ── Nginx: public entry point ──────────────────────────────────
  devlog_nginx:
    image: nginx:1.31-alpine@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f
    container_name: devlog_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - homelab_net # Connects to Cloudflare Tunnel
      - devlog_internal   # Connects to backend/frontend

  # ── Frontend: React SPA served by nginx ────────────────────────
  frontend:
    image: ghcr.io/diing54/devlog/frontend:latest@sha256:4963ac86d4de8b619d08ae9b052903b75ba2f19020a63c46e1452870eb04f04a
    container_name: devlog_frontend
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Backend: Node.js REST API ───────────────────────────────────
  backend:
    image: ghcr.io/diing54/devlog/backend:latest@sha256:b721fa9be4425f589eea9f6713a0e3a706c232df8f8d15ed3ee96245952de663
    container_name: devlog_backend
    env_file: .env
    environment:
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── PostgreSQL: persistent storage ─────────────────────────────
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: devlog_postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - devlog_internal

  # ── Redis: caching layer ────────────────────────────────────────
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: devlog_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devlog_internal

volumes:
  postgres_data:
  redis_data:

networks:
  homelab_net:
    external: true
  devlog_internal:
    driver: bridge
