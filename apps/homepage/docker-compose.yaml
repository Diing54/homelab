services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:690ac1f79e33000c176c2a28229ed00b49b44781e8a63f280a8ece22c161f099
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.cloudiing.com, localhost, 127.0.0.1
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
