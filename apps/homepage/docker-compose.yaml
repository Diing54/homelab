services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.cloudiing.com, localhost, 127.0.0.1
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
