services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.cloudiing.com, localhost, 127.0.0.1
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
