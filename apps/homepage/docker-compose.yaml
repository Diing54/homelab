services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.cloudiing.com, localhost, 127.0.0.1
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
