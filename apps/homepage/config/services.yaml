- Infrastructure & Security:
    - Cloudflare Tunnel:
        icon: cloudflare
        href: https://one.dash.cloudflare.com/
        description: Zero Trust Network Access
        server: my-docker
        container: cloudflare_tunnel
        widget:
            type: cloudflared
            accountid: 909a74f124a0392947fb2bdba4b05835
            tunnelid: ae63b0ee-ef92-48f6-b66d-135b488b4d5f
            key: "{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}"  

    - Vaultwarden:
        icon: bitwarden
        href: https://vaultwarden.cloudiing.com
        description: Password Manager
        server: my-docker
        container: vaultwarden
        ping: https://vaultwarden.cloudiing.com


- Knowledge Base:
    - Paperless-ngx:
        icon: paperless-ngx
        href: https://paperless.cloudiing.com
        description: Document Management System
        server: my-docker
        container: paperless-webserver
        widget:
            type: paperlessngx
            url: http://paperless-webserver:8000
            key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"

    - Linkding:
        icon: linkding
        href: https://linkding.cloudiing.com/bookmarks?q=!unread
        description: Unread Bookmarks
        server: my-docker
        container: linkding
        widget:
            type: customapi
            url: "http://linkding:9090/api/bookmarks/?q=!unread"
            headers:
                Authorization: "Token {{HOMEPAGE_VAR_LINKDING_TOKEN}}"
            mappings:
                - field: count
                  label: Unread

    - DevOps Notes:
        icon: mdi-book-open-page-variant-outline
        href: https://devops.cloudiing.com
        description: Cloud & DevOps Wiki
        server: my-docker
        container: devops

- Web & Projects:
    - DevLog:
        icon: mdi-clipboard-text-clock-outline
        href: https://devlog.cloudiing.com
        description: Personal Activity Tracker
        server: my-docker
        container: devlog_nginx

    - Blog:
        icon: hugo
        href: https://cloudiing.com
        description: Public Tech Blog
        server: my-docker
        container: hugo_blog
