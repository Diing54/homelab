---
- greeting:
    text_size: 2xl
    text: "Chiman"

- datetime:
    text_size: l
    format:
      dateStyle: full
      timeStyle: short
      hour12: false
    locale: en-KE

- resources:
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    units: metric
    refresh: 3000

- search:
    provider: duckduckgo
    target: _blank
    focus: true
    
