---
- greeting:
    text_size: 2xl
    text: "Hey Diing 👋"

- datetime:
    text_size: l
    format:
      dateStyle: full
      timeStyle: short
      hour12: false
    locale: en-KE

- resources:
    label: Raspberry Pi
    cpu: true
    memory: true
    disk: /
    cputemp: true
    uptime: true
    units: metric
    refresh: 3000
    diskUnits: bytes

- search:
    provider: duckduckgo
    target: _blank
    focus: true
    
- openweathermap:
    latitude: -1.2921
    longitude: 36.8219
    units: metric
    cache: 10
