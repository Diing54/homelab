services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:61ac82d4f20ab26b68ea4903f81b65920820970014bbb43d236841e05de91a6b
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
