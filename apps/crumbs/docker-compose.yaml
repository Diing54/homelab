services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:94ed0c4e284571e6db08d4972bb4034b04897368de8514bed6bde4d44ffa4a25
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
