services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:c0a18a473809256c5d079a4e326faa850de95e83744ec3e3ee821d669b26b4f7
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
