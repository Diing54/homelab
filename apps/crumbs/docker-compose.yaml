services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:8111c49e8a4c715ba825b4fca50316cffb8958b4522e867b77a8a048baa124fa
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
