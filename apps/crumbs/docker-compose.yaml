services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:143fc8d1f7c03ce79907d3d50c7509dd2692f33a55225007341277a35076dd94
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
