services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:0a722733dcee8d78cd61153724b14fabda533502d10dfff11c65cacc20e4ce96
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
