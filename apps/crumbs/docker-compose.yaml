services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:e2030eaf72349bc89f9a2d07210222d848133d8683c2f20a57f7de96cfa46917
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
