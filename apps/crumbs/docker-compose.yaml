services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:1e9c93d3c852a060f59c1c1bcf90254685924033f8d7eb5679a6e4deefc46c32
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
