services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:latest@sha256:6afac3a332b34f8770b801464b49e995ab93f7235a7b277a4f63aafaf2d337d0
    container_name: crumbs
    restart: unless-stopped
    networks:
      - homelab_net
    ports:
      - "3000:3000"
    volumes:
      - crumbs_data:/data
    environment:
      - ORIGIN=https://crumbs.cloudiing.com
      
volumes:
  crumbs_data:

networks:
  homelab_net:
    external: true
