services:
  pairdrop:
    image: ghcr.io/schlagmichdoch/pairdrop:latest@sha256:14f2f9da12c7c26708b0077ca1c425a2bef799c333408baf0540ca4d7a9f0205
    container_name: pairdrop
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - TZ=Africa/Nairobi
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
