services:
  gitops-webhook:
    build: .
    container_name: gitops-webhook
    restart: unless-stopped
    env_file: .env
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/astro/homelab:/home/astro/homelab
      - ./hooks.json.template:/etc/webhook/hooks.json.template:ro
      - /home/astro/.ssh/homelab_deploy_key:/root/.ssh/id_ed25519:ro
      # Share the host's Docker login session with the container
      - /home/astro/.docker:/root/.docker:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
